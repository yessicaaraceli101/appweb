<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movil Check — Ingreso</title>
    <style>
        :root {
            --primary: #1a73e8;       /* Azul Eléctrico SPYComers */
            --logo-red: #d93025;      /* Rojo Deportivo Movil Check */
            --dark-grey: #0f172a;     /* Gris Oscuro Slate */
            --white: #ffffff;
            --border-soft: #cbd5e1;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            margin: 0;
            padding: 24px;
            min-height: 100vh;

            /* Foto de la flota de fondo, con un velo en los colores de marca para mantener el contraste */
            background-image:
                url("{{ url_for('static', filename='imagens/IMG-20250717-WA0054.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.96);
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.35);
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            text-align: center;
        }

        /* CONTENEDOR PARA TU LOGO REAL SVG */
        .logo-container { margin-bottom: 20px; display: flex; justify-content: center; }
        .img-logo-login { height: 50px; width: auto; object-fit: contain; }

        .welcome-title { margin: 0; color: var(--dark-grey); font-size: 26px; font-weight: 900; letter-spacing: -0.5px; }
        .welcome-title span { color: var(--logo-red); }
        .subtitle { display: block; font-size: 11px; color: #64748b; text-transform: uppercase; margin-top: 6px; font-weight: bold; letter-spacing: 1.5px; margin-bottom: 30px; }

        .campo { margin-bottom: 22px; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #475569; font-size: 13.5px; }

        /* Cuadros de texto estilizados */
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.2s;
            color: var(--dark-grey);
            background-color: #fff;
            font-family: inherit;
        }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(26, 115, 232, 0.15); }

        button {
            width: 100%;
            background: linear-gradient(135deg, #1a73e8 0%, #0f52ba 100%);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 6px 20px rgba(26, 115, 232, 0.2);
            transition: all 0.2s;
            font-family: inherit;
        }
        button:hover { transform: translateY(-1px); filter: brightness(1.05); box-shadow: 0 8px 24px rgba(26, 115, 232, 0.25); }

        .footer { text-align: center; font-size: 11px; color: #94a3b8; margin-top: 35px; font-weight: bold; letter-spacing: 0.5px; text-transform: uppercase; }

        @media (max-width: 480px) {
            .login-card { padding: 32px 24px; border-radius: 20px; }
            .welcome-title { font-size: 22px; }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- 1. LLAMADA A TU LOGO SVG CARGADO DESDE STATIC -->
        <div class="logo-container">
            <img src="{{ url_for('static', filename='imagens/logo-movilcheck.svg.svg') }}" alt="Movil Check" class="img-logo-login">
        </div>

        <!-- 2. TITULO DE BIENVENIDO -->
        <h2 class="welcome-title">¡Bienvenido<span>!</span></h2>
        <span class="subtitle">Infraestructura Corporativa SPYComers</span>

        <form action="/autenticar" method="POST">
            <!-- 3. CUADRO DE TEXTO PARA ESCRIBIR EL NOMBRE DIRECTAMENTE (SIN LISTA AUTOMATICA) -->
            <div class="campo">
                <label for="nombre_usuario">Nombre de Usuario / Chofer:</label>
                <input type="text" name="nombre_usuario" id="nombre_usuario" required placeholder="Ej: Oscar o Administrador" autocomplete="off">
            </div>

            <div class="campo">
                <label for="contrasena">Contraseña Corporativa:</label>
                <input type="password" name="contrasena" id="contrasena" placeholder="Dejar vacío si no tiene">
            </div>

            <button type="submit">Ingresar al Sistema</button>
        </form>
        <div class="footer">spycomers — Seguridad Activa</div>
    </div>

</body>
</html>
